name: Maven build and publish

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: maven-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean package

  publish:
    name: Publish Maven artifact
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Maven credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAVEN_USERNAME:-}" || -z "${MAVEN_PASSWORD:-}" ]]; then
            echo '::error::Missing INTERLIS_MAVEN_USERNAME or INTERLIS_MAVEN_TOKEN repository secret.'
            exit 1
          fi
          echo 'Publishing the existing Maven snapshot version from pom.xml to the snapshot repository.'

      - name: Set up Java 21 and Maven credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: interlis-guru
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD

      - name: Build and publish
        env:
          MAVEN_REPOSITORY_URL: https://jars.interlis.guru/snapshots/
        shell: bash
        run: |
          set -euo pipefail

          mvn \
            --batch-mode \
            --no-transfer-progress \
            '-Dspotbugs.skip=true' \
            "-DaltDeploymentRepository=interlis-guru::${MAVEN_REPOSITORY_URL}" \
            clean deploy
